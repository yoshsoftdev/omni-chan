x-nats-node: &nats-node
  image: nats:2.10-alpine
  expose:
    - "4222"
    - "6222"
    - "8222"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
    interval: 5s
    timeout: 5s
    retries: 20

# Shared by every backend role (api, event-consumer, scheduler).
x-backend-env: &backend-env
    APP_ENV: production
    HTTP_PORT: 8090
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/omni_chan?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    STORAGE_SERVICE_URL: http://storage-service:8082
    NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
    NATS_STREAM_NAME: WEBHOOK_EVENTS
    NATS_STREAM_REPLICAS: "3"
    NATS_CONSUMER_ENABLED: "true"
    INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-token}
    MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET}
    MEDIA_TOKEN_TTL: ${MEDIA_TOKEN_TTL:-5m}
    WEBHOOK_PUBLIC_BASE_URL: ${WEBHOOK_PUBLIC_BASE_URL}
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    META_APP_ID: ${META_APP_ID}
    META_APP_SECRET: ${META_APP_SECRET}
    META_EMBEDDED_CONFIG_ID: ${META_EMBEDDED_CONFIG_ID}
    META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
    META_API_VERSION: ${META_API_VERSION:-v21.0}
    META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY:?set META_TOKEN_ENCRYPTION_KEY (base64 of 32 random bytes)}
    OTP_DEFAULT_DEVICE_SLUG: ${OTP_DEFAULT_DEVICE_SLUG:-dgos-waba}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omni_chan
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omni_chan"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # NATS JetStream, 3-node cluster (ADR 0009): streams use Replicas 3, so losing one node
  # neither stops ingest/broadcast nor loses acknowledged events.
  nats-1:
    <<: *nats-node
    command: ["--name", "nats-1", "-js", "-sd", "/data", "-m", "8222", "--cluster_name", "omni", "--cluster", "nats://0.0.0.0:6222", "--routes", "nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222"]
    volumes:
      - nats-1-data:/data

  nats-2:
    <<: *nats-node
    command: ["--name", "nats-2", "-js", "-sd", "/data", "-m", "8222", "--cluster_name", "omni", "--cluster", "nats://0.0.0.0:6222", "--routes", "nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222"]
    volumes:
      - nats-2-data:/data

  nats-3:
    <<: *nats-node
    command: ["--name", "nats-3", "-js", "-sd", "/data", "-m", "8222", "--cluster_name", "omni", "--cluster", "nats://0.0.0.0:6222", "--routes", "nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222"]
    volumes:
      - nats-3-data:/data

  webhook-service:
    build:
      context: .
      dockerfile: services/webhook-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      APP_ENV: production
      HTTP_PORT: 8081
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      NATS_STREAM_NAME: WEBHOOK_EVENTS
      NATS_STREAM_REPLICAS: "3"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-token}
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET}
      MEDIA_BACKEND_URL: http://backend-service:8090
      META_APP_SECRET: ${META_APP_SECRET}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      METRICS_ADDR: ":9104"
    expose:
      - "9104" # /metrics /health /ready — internal only, never published
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9104/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      nats-1:
        condition: service_healthy
      nats-2:
        condition: service_healthy
      nats-3:
        condition: service_healthy

  backend-service:
    build:
      context: .
      dockerfile: services/backend-service/Dockerfile
    expose:
      - "8090"
      - "9101" # /metrics /health /ready — internal only, never published
    environment:
      <<: *backend-env
      METRICS_ADDR: ":9101"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9101/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats-1:
        condition: service_healthy
      nats-2:
        condition: service_healthy
      nats-3:
        condition: service_healthy

  backend-event-consumer:
    # Consumes webhook events (meta.>) from NATS; scale replicas freely.
    build:
      context: .
      dockerfile: services/backend-service/Dockerfile
    command: ["./event-consumer"]
    expose:
      - "9106" # /metrics /health /ready — internal only, never published
    environment:
      <<: *backend-env
      METRICS_ADDR: ":9106"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9106/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      backend-service:
        condition: service_healthy

  backend-scheduler:
    # Periodic jobs (window recontact, delivery reconcile, purge); each job holds a Postgres advisory lock.
    build:
      context: .
      dockerfile: services/backend-service/Dockerfile
    command: ["./scheduler"]
    expose:
      - "9107" # /metrics /health /ready — internal only, never published
    environment:
      <<: *backend-env
      METRICS_ADDR: ":9107"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9107/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      backend-service:
        condition: service_healthy

  storage-service:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    expose:
      - "8082"
      - "9105" # /metrics /health /ready — internal only, never published
    environment:
      APP_ENV: production
      HTTP_PORT: 8082
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/omni_chan?sslmode=disable
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /data/storage
      STORAGE_PUBLIC_BASE_URL: http://storage-service:8082
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-token}
      METRICS_ADDR: ":9105"
    volumes:
      - storage_data:/data/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9105/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      # Storage migrations reference backend tables (teams); start after backend migrated.
      backend-service:
        condition: service_healthy

volumes:
  postgres_data:
  nats-1-data:
  nats-2-data:
  nats-3-data:
  storage_data:
