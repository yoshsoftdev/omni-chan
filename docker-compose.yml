services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omni_chan
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omni_chan"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    expose:
      - "4222"
      - "8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  webhook-service:
    build:
      context: .
      dockerfile: services/webhook-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      APP_ENV: production
      HTTP_PORT: 8081
      NATS_URL: nats://nats:4222
      NATS_STREAM_NAME: WEBHOOK_EVENTS
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-token}
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET}
      MEDIA_BACKEND_URL: http://backend-service:8090
      META_APP_SECRET: ${META_APP_SECRET}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      METRICS_ADDR: ":9104"
    expose:
      - "9104" # /metrics /health /ready — internal only, never published
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9104/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      nats:
        condition: service_healthy

  backend-service:
    build:
      context: .
      dockerfile: services/backend-service/Dockerfile
    expose:
      - "8090"
      - "9101" # /metrics /health /ready — internal only, never published
    environment:
      APP_ENV: production
      HTTP_PORT: 8090
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/omni_chan?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_SERVICE_URL: http://storage-service:8082
      NATS_URL: nats://nats:4222
      NATS_STREAM_NAME: WEBHOOK_EVENTS
      NATS_CONSUMER_ENABLED: "true"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-token}
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET}
      MEDIA_TOKEN_TTL: ${MEDIA_TOKEN_TTL:-5m}
      WEBHOOK_PUBLIC_BASE_URL: ${WEBHOOK_PUBLIC_BASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_EMBEDDED_CONFIG_ID: ${META_EMBEDDED_CONFIG_ID}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_API_VERSION: ${META_API_VERSION:-v21.0}
      META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY:?set META_TOKEN_ENCRYPTION_KEY (base64 of 32 random bytes)}
      OTP_DEFAULT_DEVICE_SLUG: ${OTP_DEFAULT_DEVICE_SLUG:-dgos-waba}
      METRICS_ADDR: ":9101"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9101/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  storage-service:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    expose:
      - "8082"
      - "9105" # /metrics /health /ready — internal only, never published
    environment:
      APP_ENV: production
      HTTP_PORT: 8082
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/omni_chan?sslmode=disable
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /data/storage
      STORAGE_PUBLIC_BASE_URL: http://storage-service:8082
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-token}
      METRICS_ADDR: ":9105"
    volumes:
      - storage_data:/data/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9105/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      # Storage migrations reference backend tables (teams); start after backend migrated.
      backend-service:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
