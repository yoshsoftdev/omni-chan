  /contacts/import/csv:
    post:
      tags:
      - Contacts
      summary: Import contacts from a CSV file
      description: Synchronous, up to 5000 rows and 10 MB. Existing phone numbers are updated with the non-empty
        fields of the row; new ones are created with source `import`. Bad rows are skipped and reported by file line.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                mapping:
                  type: string
                  description: 'JSON object of file column header to field (name, phone, email, notes, city,
                    company; empty string skips the column). Without it, common header names are recognised, and
                    a file without a header is read as name, phone, email, notes.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ContactImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: contactsImportCsv
