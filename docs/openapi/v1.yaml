openapi: 3.0.3
info:
  title: Omni-Chan API
  version: 1.0.0
  description: HTTP API v1 for the Omni-Chan omnichannel platform.
servers:
- url: /api/v1
  description: API v1 base path
tags:
- name: Auth
  description: Sign-up, login, tokens and invitations
- name: Workspace
  description: Workspace profile, quotas and readiness
- name: Teams
  description: Members, roles and permissions
- name: Channels
  description: WhatsApp/Instagram channels, embedded signup, health and sync
- name: Templates
  description: WhatsApp message templates
- name: Contacts
  description: Contacts, custom fields and linking
- name: Providers
  description: Provider profiles (one per contact per provider)
- name: Segments
  description: Saved audience filters
- name: Tags
  description: Manual contact labels
- name: Campaigns
  description: Broadcast campaigns
- name: Reports
  description: Campaign analytics
- name: Conversations
  description: Inbox conversations, notes, presence
- name: Messages
  description: Messages inside conversations
- name: Dashboard
  description: Home dashboard data
- name: Onboarding
  description: Onboarding checklist
- name: Operations
  description: Broadcast operations view
- name: Automation
  description: Automation endpoints, API keys and forward webhooks
- name: Inbox
  description: Inbox list and inbox settings
- name: Internal
  description: Service-to-service routes (X-Internal-Token)
- name: Quick Replies
  description: Canned responses
- name: Storage
  description: File storage (proxied to storage-service)
- name: Webhooks
  description: Inbound provider webhooks
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Service-to-service token; never exposed publicly
  schemas:
    SuccessResponse:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          description: Operation payload (see each operation)
    ErrorResponse:
      type: object
      required:
      - success
      - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - validation_error
              - unauthorized
              - forbidden
              - not_found
              - conflict
              - quota_exceeded
              - feature_not_available
              - payment_required
              - permission_required
              - internal_error
            message:
              type: string
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer
    ProviderProfile:
      type: object
      required:
      - id
      - team_id
      - contact_id
      - provider
      - provider_user_id
      - metadata
      - connected_at
      - status
      - is_source_of_truth
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - email
          - instagram
          - messenger
          - telegram
          - whatsapp
        provider_user_id:
          type: string
        channel_id:
          type: string
          format: uuid
          nullable: true
        display_name:
          type: string
        username:
          type: string
        phone:
          type: string
        avatar_url:
          type: string
        email:
          type: string
        metadata: {}
        connected_at:
          type: string
          format: date-time
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        last_observed_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - active
          - unavailable
          - unlinked
        is_source_of_truth:
          type: boolean
        conversation_ids:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProviderActivity:
      type: object
      required:
      - id
      - team_id
      - contact_id
      - type
      - description
      - metadata
      - created_at
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        provider_profile_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum:
          - provider_linked
          - provider_unlinked
          - source_of_truth_changed
        actor_id:
          type: string
          format: uuid
          nullable: true
        actor_name:
          type: string
        description:
          type: string
        metadata: {}
        created_at:
          type: string
          format: date-time
    DashboardOverview:
      type: object
      required:
      - contacts
      - channels
      - campaigns
      - unread_conversations
      - open_conversations
      - unassigned_conversations
      - readiness_score
      properties:
        contacts:
          type: integer
          format: int64
        channels:
          type: integer
          format: int64
        campaigns:
          type: integer
          format: int64
        unread_conversations:
          type: integer
          format: int64
        open_conversations:
          type: integer
          format: int64
        unassigned_conversations:
          type: integer
          format: int64
        avg_first_response_seconds:
          type: number
          nullable: true
        avg_resolution_seconds:
          type: number
          nullable: true
        readiness_score:
          type: integer
        last_contact_sync_at:
          type: string
          format: date-time
          nullable: true
        last_template_sync_at:
          type: string
          format: date-time
          nullable: true
        last_conversation_sync_at:
          type: string
          format: date-time
          nullable: true
        permission_status:
          type: string
    AcceptInviteRequest:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
    AddMemberRequest:
      type: object
      properties:
        email:
          type: string
        role:
          type: string
    AssignConversationRequest:
      type: object
      properties:
        user_id:
          type: string
          nullable: true
        assignee_id:
          type: string
          nullable: true
    AuthMeResponse:
      type: object
      required:
      - user
      - team
      - role
      - permissions
      properties:
        user:
          $ref: '#/components/schemas/AuthUserProfile'
        team:
          $ref: '#/components/schemas/AuthTeamProfile'
        role:
          type: string
        permissions:
          type: array
          description: Permission codes the role grants (e.g. contact.create). The UI shows only actions in this list; the API enforces the same codes.
          items:
            type: string
    AuthTeamProfile:
      type: object
      required:
      - id
      - name
      - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    AuthUserProfile:
      type: object
      required:
      - id
      - email
      - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
    AutomationAPIKey:
      type: object
      required:
      - id
      - teamId
      - name
      - keyPrefix
      - scopes
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        teamId:
          type: string
          format: uuid
        name:
          type: string
        keyPrefix:
          type: string
        scopes:
          type: array
          nullable: true
          items:
            type: string
        status:
          type: string
          enum:
          - active
          - disabled
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    AutomationAPIKeySecretResult:
      type: object
      required:
      - secret
      properties:
        key:
          allOf:
          - $ref: '#/components/schemas/AutomationAPIKey'
          nullable: true
          type: object
        secret:
          type: string
    AutomationClientIPCount:
      type: object
      required:
      - ip
      - count
      properties:
        ip:
          type: string
        count:
          type: integer
          format: int64
    AutomationDayRequestStat:
      type: object
      required:
      - date
      - success
      - failed
      properties:
        date:
          type: string
        success:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
    AutomationEndpoint:
      type: object
      required:
      - id
      - teamId
      - name
      - slug
      - description
      - method
      - status
      - actionType
      - actionConfig
      - webhook
      - createdAt
      - updatedAt
      - stats
      properties:
        id:
          type: string
        teamId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        method:
          type: string
        status:
          type: string
          enum:
          - active
          - disabled
        actionType:
          type: string
          enum:
          - send_template
          - send_text
        actionConfig: {}
        webhook:
          $ref: '#/components/schemas/AutomationWebhookConfig'
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        stats:
          $ref: '#/components/schemas/AutomationEndpointStats'
    AutomationEndpointAnalytics:
      type: object
      required:
      - endpointId
      - callsToday
      - totalRequests
      - successRate
      - failedRequests
      - averageLatencyMs
      - topClientIps
      - requestsOverTime
      properties:
        endpointId:
          type: string
        callsToday:
          type: integer
          format: int64
        totalRequests:
          type: integer
          format: int64
        successRate:
          type: number
        failedRequests:
          type: integer
          format: int64
        averageLatencyMs:
          type: integer
          format: int64
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          allOf:
          - $ref: '#/components/schemas/AutomationLastError'
          nullable: true
          type: object
        topClientIps:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AutomationClientIPCount'
        requestsOverTime:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AutomationDayRequestStat'
    AutomationEndpointStats:
      type: object
      required:
      - totalCalls
      - successRate
      - failedCalls
      - callsToday
      - averageLatencyMs
      properties:
        totalCalls:
          type: integer
          format: int64
        successRate:
          type: number
        failedCalls:
          type: integer
          format: int64
        callsToday:
          type: integer
          format: int64
        averageLatencyMs:
          type: integer
          format: int64
    AutomationForwardDelivery:
      type: object
      required:
      - id
      - teamId
      - webhookId
      - eventType
      - status
      - statusCode
      - attemptedAt
      properties:
        id:
          type: string
        teamId:
          type: string
          format: uuid
        webhookId:
          type: string
        eventType:
          type: string
        messageId:
          type: string
          format: uuid
          nullable: true
        conversationId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
          - failed
          - success
        statusCode:
          type: integer
        errorMessage:
          type: string
          nullable: true
        attemptedAt:
          type: string
          format: date-time
    AutomationForwardWebhook:
      type: object
      required:
      - id
      - teamId
      - name
      - url
      - status
      - events
      - onlyUnassigned
      - assignAutomationOnReopen
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        teamId:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        secret:
          type: string
        status:
          type: string
          enum:
          - active
          - disabled
        events:
          type: array
          nullable: true
          items:
            type: string
        channelId:
          type: string
          format: uuid
          nullable: true
        onlyUnassigned:
          type: boolean
        assignAutomationOnReopen:
          type: boolean
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    AutomationInboxAutomationSettings:
      type: object
      required:
      - enabled
      - hasWebhook
      properties:
        enabled:
          type: boolean
        hasWebhook:
          type: boolean
    AutomationLastError:
      type: object
      required:
      - at
      - message
      - statusCode
      properties:
        at:
          type: string
          format: date-time
        message:
          type: string
        statusCode:
          type: integer
    AutomationSummary:
      type: object
      required:
      - endpointCount
      - requestsToday
      - successRate
      - failedToday
      - apiKeyCount
      properties:
        endpointCount:
          type: integer
          format: int64
        requestsToday:
          type: integer
          format: int64
        successRate:
          type: number
        failedToday:
          type: integer
          format: int64
        apiKeyCount:
          type: integer
          format: int64
    AutomationWebhookConfig:
      type: object
      required:
      - url
      - isEnabled
      properties:
        url:
          type: string
        isEnabled:
          type: boolean
        secret:
          type: string
    Campaign:
      type: object
      required:
      - ID
      - TeamID
      - ChannelID
      - TemplateID
      - Name
      - Status
      - VariableMapping
      - SampleValues
      - TotalContacts
      - SentCount
      - DeliveredCount
      - ReadCount
      - FailedCount
      - ReplyCount
      - ClickedCount
      - CreatedAt
      - UpdatedAt
      properties:
        ID:
          type: string
          format: uuid
        TeamID:
          type: string
          format: uuid
        ChannelID:
          type: string
          format: uuid
        TemplateID:
          type: string
          format: uuid
        SegmentID:
          type: string
          format: uuid
          nullable: true
        Name:
          type: string
        Description:
          type: string
          nullable: true
        Status:
          type: string
          enum:
          - cancelled
          - completed
          - draft
          - failed
          - queued
          - scheduled
          - sending
        VariableMapping: {}
        SampleValues: {}
        Timezone:
          type: string
          nullable: true
        SendMode:
          type: string
          enum:
          - later
          - now
          nullable: true
        ScheduledAt:
          type: string
          format: date-time
          nullable: true
        StartedAt:
          type: string
          format: date-time
          nullable: true
        CompletedAt:
          type: string
          format: date-time
          nullable: true
        TotalContacts:
          type: integer
        SentCount:
          type: integer
        DeliveredCount:
          type: integer
        ReadCount:
          type: integer
        FailedCount:
          type: integer
        ReplyCount:
          type: integer
        ClickedCount:
          type: integer
        CreatedBy:
          type: string
          format: uuid
          nullable: true
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
        DeletedAt:
          type: string
          format: date-time
          nullable: true
    CampaignAudienceSourceView:
      type: object
      required:
      - type
      - id
      - name
      properties:
        type:
          type: string
        id:
          type: string
        name:
          type: string
    CampaignAudienceSummary:
      type: object
      required:
      - type
      - name
      - recipient_count
      - snapshot
      properties:
        type:
          type: string
        name:
          type: string
        recipient_count:
          type: integer
        snapshot:
          type: boolean
        snapshot_at:
          type: string
          format: date-time
          nullable: true
        extra_audiences:
          type: integer
        sources:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/CampaignAudienceSourceView'
    CampaignResponse:
      type: object
      required:
      - id
      - name
      - status
      - channel_id
      - template_id
      - total_contacts
      - sent_count
      - delivered_count
      - read_count
      - failed_count
      - reply_count
      - clicked_count
      - created_at
      - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
        channel_id:
          type: string
        template_id:
          type: string
        template_name:
          type: string
        template_language:
          type: string
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        total_contacts:
          type: integer
        sent_count:
          type: integer
        delivered_count:
          type: integer
        read_count:
          type: integer
        failed_count:
          type: integer
        reply_count:
          type: integer
        clicked_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        audience:
          allOf:
          - $ref: '#/components/schemas/CampaignAudienceSummary'
          nullable: true
          type: object
        audiences:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/CampaignAudienceSourceView'
    CancelCampaignRequest:
      type: object
      properties:
        reason:
          type: string
    Channel:
      type: object
      required:
      - id
      - team_id
      - name
      - provider
      - channel_type
      - status
      - is_coex
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
        channel_type:
          type: string
          enum:
          - instagram
          - whatsapp
        status:
          type: string
          enum:
          - connected
          - connecting
          - disconnected
        connection_type:
          type: string
          enum:
          - embedded_coex
          - manual
          - oauth
          nullable: true
        phone_number:
          type: string
          nullable: true
        waba_id:
          type: string
          nullable: true
        phone_number_id:
          type: string
          nullable: true
        business_id:
          type: string
          nullable: true
        ig_user_id:
          type: string
          nullable: true
        is_coex:
          type: boolean
        last_connected_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
    ChannelManualVerifyChecks:
      type: object
      required:
      - token
      - waba
      - phone
      - templates_api
      properties:
        token:
          type: boolean
        waba:
          type: boolean
        phone:
          type: boolean
        templates_api:
          type: boolean
    ChannelManualVerifyResult:
      type: object
      required:
      - template_count
      - checks
      properties:
        waba_name:
          type: string
        phone_display:
          type: string
        template_count:
          type: integer
        checks:
          $ref: '#/components/schemas/ChannelManualVerifyChecks'
    ChannelmgmtChannelStatusEntry:
      type: object
      required:
      - type
      - connected
      properties:
        type:
          type: string
        connected:
          type: boolean
        display_name:
          type: string
    ChannelmgmtChannelTypeInfo:
      type: object
      required:
      - type
      - display_name
      - supported
      properties:
        type:
          type: string
        display_name:
          type: string
        supported:
          type: boolean
    ChannelmgmtStatusReport:
      type: object
      required:
      - channels
      properties:
        channels:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ChannelmgmtChannelStatusEntry'
    ChannelsyncContactSyncResult:
      type: object
      required:
      - created
      - updated
      - duplicates
      properties:
        created:
          type: integer
        updated:
          type: integer
        duplicates:
          type: integer
    ChannelsyncConversationSyncResult:
      type: object
      required:
      - imported
      properties:
        imported:
          type: integer
        reason:
          type: string
          nullable: true
    ChannelsyncPermissions:
      type: object
      required:
      - contacts
      - templates
      - conversation_sync
      properties:
        contacts:
          type: boolean
        templates:
          type: boolean
        conversation_sync:
          type: boolean
        last_checked_at:
          type: string
          format: date-time
          nullable: true
    ChannelsyncResourceStatus:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - completed
          - failed
          - in_progress
          - not_synced
        created:
          type: integer
          nullable: true
        updated:
          type: integer
          nullable: true
        synced:
          type: integer
          nullable: true
        imported:
          type: integer
          nullable: true
    ChannelsyncStatusResponse:
      type: object
      required:
      - permissions
      - contacts
      - templates
      - conversations
      properties:
        permissions:
          type: string
          enum:
          - expired
          - granted
          - missing
        contacts:
          $ref: '#/components/schemas/ChannelsyncResourceStatus'
        templates:
          $ref: '#/components/schemas/ChannelsyncResourceStatus'
        conversations:
          $ref: '#/components/schemas/ChannelsyncResourceStatus'
        last_sync_at:
          type: string
          format: date-time
          nullable: true
    CompleteEmbeddedSignupRequest:
      type: object
      properties:
        code:
          type: string
        oauth_state:
          type: string
        business_id:
          type: string
        waba_id:
          type: string
        phone_number_id:
          type: string
    CompleteOnboardingStepRequest:
      type: object
      properties:
        step:
          type: integer
    Contact:
      type: object
      required:
      - id
      - team_id
      - contact_name
      - customer_name
      - phone
      - source
      - marketing_status
      - tags
      - providers
      - linked_contacts
      - conversations_count
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        contact_name:
          type: string
        customer_name:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        notes:
