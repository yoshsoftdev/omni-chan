  /campaigns/{id}/send:
    post:
      tags: [Campaigns]
      security: [{ bearerAuth: [] }]
      summary: Queue campaign for broadcast send
      description: |
        Transitions a draft or scheduled campaign to `queued` and enqueues a
        `broadcast.job.created` outbox event for the orchestrator pipeline.
        Requires `campaign.send` permission.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Campaign queued for send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /campaigns/{id}/cancel:
    post:
      tags: [Campaigns]
      security: [{ bearerAuth: [] }]
      summary: Cancel campaign
      description: |
        Cancels a campaign and non-terminal recipients. Sets PostgreSQL state
        to `cancelled` and a Redis cancel flag (`cancel:campaign:{id}`, TTL 24h)
        for fast worker polling. Requires `campaign.cancel` permission.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional human-readable cancel reason
      responses:
        '200':
          description: Campaign cancelled (idempotent if already cancelled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /operations/broadcast:
    get:
      tags: [Operations]
      security: [{ bearerAuth: [] }]
      summary: Broadcast pipeline status
      description: Read-only operational metrics. Requires `workspace.manage`.
      responses:
        '200':
          description: Broadcast pipeline snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
