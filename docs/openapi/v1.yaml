openapi: 3.0.3
info:
  title: Omni-Chan API
  version: 1.0.0
  description: HTTP API v1 for the Omni-Chan omnichannel platform.

servers:
  - url: /api/v1
    description: API v1 base path

tags:
  - name: Auth
  - name: Workspace
  - name: Teams
  - name: Channels
  - name: Templates
  - name: Contacts
  - name: Providers
  - name: Segments
  - name: Tags
  - name: Campaigns
  - name: Reports
  - name: Conversations
  - name: Messages
  - name: Dashboard
  - name: Onboarding
  - name: Operations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - validation_error
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - quota_exceeded
                - feature_not_available
                - internal_error
            message:
              type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    PageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    ProviderProfile:
      type: object
      required:
        [id, team_id, contact_id, provider, provider_user_id, connected_at, status, is_source_of_truth]
      properties:
        id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        provider:
          type: string
          description: Extensible provider key such as whatsapp, instagram, messenger, telegram, or email.
        provider_user_id: { type: string }
        channel_id: { type: string, format: uuid, nullable: true }
        display_name: { type: string }
        username: { type: string }
        phone: { type: string }
        avatar_url: { type: string, format: uri }
        email: { type: string, format: email }
        metadata: { type: object, additionalProperties: true }
        connected_at: { type: string, format: date-time }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_observed_at: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [active, unavailable, unlinked]
        is_source_of_truth: { type: boolean }
        conversation_ids:
          type: array
          items: { type: string, format: uuid }

    LinkedContact:
      type: object
      required: [link_id, id, contact_name, customer_name, phone, provider_kinds, linked_at]
      properties:
        link_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        contact_name: { type: string }
        customer_name: { type: string }
        phone: { type: string }
        email: { type: string, format: email, nullable: true }
        avatar_url: { type: string, format: uri, nullable: true }
        provider_kinds:
          type: array
          items: { type: string }
        linked_at: { type: string, format: date-time }

    ContactLinkRequest:
      type: object
      required: [contact_id]
      properties:
        contact_id: { type: string, format: uuid }

    ProviderLinkRequest:
      type: object
      required: [contact_id]
      properties:
        contact_id: { type: string, format: uuid }
        reason: { type: string, maxLength: 500 }

    ProviderUnlinkRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }

    ProviderActivity:
      type: object
      required: [id, contact_id, type, description, created_at]
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        provider_profile_id: { type: string, format: uuid, nullable: true }
        type:
          type: string
          enum: [provider_linked, provider_unlinked, source_of_truth_changed]
        actor_id: { type: string, format: uuid, nullable: true }
        actor_name: { type: string }
        description: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    ChannelTypeInfo:
      type: object
      required: [type, display_name, supported]
      properties:
        type:
          type: string
          enum: [whatsapp, instagram, messenger, telegram, email]
          example: whatsapp
        display_name:
          type: string
          example: WhatsApp Business
        supported:
          type: boolean
          example: true

    ChannelStatusEntry:
      type: object
      required: [type, connected]
      properties:
        type:
          type: string
          enum: [whatsapp, instagram]
        connected:
          type: boolean
        display_name:
          type: string
          example: Sales Line 1

    ChannelStatusReport:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelStatusEntry'

    InstagramChannelStatus:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
          example: false
        username:
          type: string
          example: brand.ig
        account_type:
          type: string
          enum: [BUSINESS, MEDIA_CREATOR]
          example: BUSINESS
        token_expiry:
          type: string
          format: date-time
          nullable: true

    ReadinessResponse:
      type: object
      properties:
        score:
          type: integer
        status:
          type: string
          enum: [not_started, in_progress, ready]
        checks:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              completed:
                type: boolean

    DashboardOverview:
      type: object
      properties:
        contacts:
          type: integer
          format: int64
        channels:
          type: integer
          format: int64
        campaigns:
          type: integer
          format: int64
        unread_conversations:
          type: integer
          format: int64
        readiness_score:
          type: integer

    OnboardingSnapshot:
      type: object
      properties:
        current_step:
          type: integer
        completed_steps:
          type: array
          items:
            type: integer
        score:
          type: integer

  parameters:
    PageParam:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      in: query
      name: page_size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FeatureNotAvailable:
      description: Feature not available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /health:
    get:
      tags: [Auth]
      summary: Health check
      responses:
        '200':
          description: OK

  /auth/register:
    post:
      tags: [Auth]
      summary: Register workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                team_name: { type: string }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Logged in

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      responses:
        '200':
          description: Token refreshed

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        '200':
          description: Logged out

  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Current user profile
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workspace:
    get:
      tags: [Workspace]
      security: [{ bearerAuth: [] }]
      summary: Get workspace
      responses:
        '200':
          description: OK
    patch:
      tags: [Workspace]
      security: [{ bearerAuth: [] }]
      summary: Update workspace
      responses:
        '200':
          description: Updated

  /workspace/quotas:
    get:
      tags: [Workspace]
      security: [{ bearerAuth: [] }]
      summary: Workspace quotas
      responses:
        '200':
          description: OK

  /workspace/readiness:
    get:
      tags: [Workspace]
      security: [{ bearerAuth: [] }]
      summary: Workspace readiness checklist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReadinessResponse'

  /workspace/readiness/refresh:
    post:
      tags: [Workspace]
      security: [{ bearerAuth: [] }]
      summary: Recompute and persist workspace readiness snapshot
      responses:
        '200':
          description: Refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReadinessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teams/members:
    get:
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      summary: List team members
      responses:
        '200':
          description: OK
    post:
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      summary: Add team member
      responses:
        '201':
          description: Created

  /teams/users:
    get:
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      summary: List team users
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: role
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items:
                              type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teams/users/invite:
    post:
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      summary: Invite user
      responses:
        '201':
          description: Invited

  /teams/users/{id}/role:
    patch:
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      summary: Update user role
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated

  /teams/users/{id}/deactivate:
    post:
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      summary: Deactivate user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deactivated

  /teams/users/{id}:
    delete:
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      summary: Remove user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Removed

  /teams/roles:
    get:
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      summary: List assignable roles
      responses:
        '200':
          description: OK

  /channels:
    get:
      tags: [Channels]
      security: [{ bearerAuth: [] }]
      summary: List channels
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Channels]
      security: [{ bearerAuth: [] }]
      summary: Create channel
      responses:
        '201':
          description: Created

  /channels/types:
    get:
      tags: [Channels]
      security: [{ bearerAuth: [] }]
      summary: List supported channel types
      description: Returns channel platform capabilities. Does not perform OAuth or Meta calls.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChannelTypeInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /channels/status:
    get:
      tags: [Channels]
      security: [{ bearerAuth: [] }]
      summary: Workspace channel connection status
      description: WhatsApp status is derived from existing channels rows. Instagram is not connected until implemented.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChannelStatusReport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /channels/instagram/status:
    get:
      tags: [Channels]
      security: [{ bearerAuth: [] }]
      summary: Instagram connection status
      description: Returns Instagram Business Login connection state for the workspace.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InstagramChannelStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /channels/instagram/connect-url:
    get:
      tags: [Channels]
      security: [{ bearerAuth: [] }]
      summary: Get Instagram Business Login authorization URL
      parameters:
        - in: query
          name: return_url
          schema:
            type: string
          description: Optional browser URL to redirect after OAuth callback completes.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [authorization_url, state, expires_at]
                        properties:
                          authorization_url:
                            type: string
                            example: https://www.instagram.com/oauth/authorize?client_id=...
                          state:
                            type: string
                          expires_at:
                            type: string
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /channels/instagram/callback:
    get:
      tags: [Channels]
      summary: Instagram Business Login OAuth callback
      description: |
        Public OAuth redirect target. Exchanges the authorization code, stores encrypted credentials,
        creates or updates the Instagram channel, then redirects to return_url when provided.
      parameters:
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
        - in: query
          name: error
          schema:
            type: string
        - in: query
          name: error_description
          schema:
            type: string
      responses:
        '200':
          description: Connected (JSON response when return_url is not set)
        '302':
          description: Redirect to return_url after success or validation error
        '400':
          $ref: '#/components/responses/BadRequest'

  /channels/instagram/connection:
    delete:
      tags: [Channels]
      security: [{ bearerAuth: [] }]
      summary: Disconnect Instagram channel for the workspace
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'

  /channels/{id}:
    get:
      tags: [Channels]
      security: [{ bearerAuth: [] }]
      summary: Get channel
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
    patch:
      tags: [Channels]
      security: [{ bearerAuth: [] }]
      summary: Update channel
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
    delete:
      tags: [Channels]
      security: [{ bearerAuth: [] }]
      summary: Delete channel
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted

  /templates:
    get:
      tags: [Templates]
      security: [{ bearerAuth: [] }]
      summary: List templates
      responses:
        '200':
          description: OK
    post:
      tags: [Templates]
      security: [{ bearerAuth: [] }]
      summary: Create template (submit to Meta for review)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, language, category, components]
              properties:
                device_id: { type: string, format: uuid, description: Alias of channel_id }
                channel_id: { type: string, format: uuid }
                name: { type: string }
                language: { type: string }
                category: { type: string, enum: [MARKETING, UTILITY, AUTHENTICATION, marketing, utility, authentication] }
                components: { type: array, items: { type: object } }
      responses:
        '201':
          description: Template submitted to Meta
        '400':
          description: Validation error
        '403':
          description: Forbidden

  /templates/{id}:
    get:
      tags: [Templates]
      security: [{ bearerAuth: [] }]
      summary: Get template
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
    delete:
      tags: [Templates]
      security: [{ bearerAuth: [] }]
      summary: Delete template from Meta and soft-delete locally
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Template deleted
        '400':
          description: Validation or Meta error
        '403':
          description: Forbidden
        '404':
          description: Template not found

  /templates/sync:
    post:
      tags: [Templates]
      security: [{ bearerAuth: [] }]
      summary: Sync templates from Meta
      responses:
        '501':
          $ref: '#/components/responses/FeatureNotAvailable'

  /contacts:
    get:
      tags: [Contacts]
      security: [{ bearerAuth: [] }]
      summary: List contacts
      responses:
        '200':
          description: OK
    post:
      tags: [Contacts]
      security: [{ bearerAuth: [] }]
      summary: Create contact
      responses:
        '201':
          description: Created

  /contacts/{id}:
    get:
      tags: [Contacts]
      security: [{ bearerAuth: [] }]
      summary: Get contact
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
    patch:
      tags: [Contacts]
      security: [{ bearerAuth: [] }]
      summary: Update contact
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
    delete:
      tags: [Contacts]
      security: [{ bearerAuth: [] }]
      summary: Delete contact
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted

  /contacts/{id}/providers:
    get:
      tags: [Providers]
      security: [{ bearerAuth: [] }]
      summary: List Provider Profiles linked to a Contact
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Provider Profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      providers:
                        type: array
                        items: { $ref: '#/components/schemas/ProviderProfile' }

  /contacts/{id}/activities:
    get:
      tags: [Providers]
      security: [{ bearerAuth: [] }]
      summary: List provider ownership activities for a Contact
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Provider activities

  /contacts/{id}/links:
    get:
      tags: [Contacts]
      security: [{ bearerAuth: [] }]
      summary: List contacts linked bidirectionally to a Contact
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Linked contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      linked_contacts:
                        type: array
                        items: { $ref: '#/components/schemas/LinkedContact' }
    post:
      tags: [Contacts]
      security: [{ bearerAuth: [] }]
      summary: Link two independent Contacts bidirectionally
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactLinkRequest' }
      responses:
        '201':
          description: Contacts linked

  /contacts/{id}/links/{linkedContactId}:
    delete:
      tags: [Contacts]
      security: [{ bearerAuth: [] }]
      summary: Remove a bidirectional Contact link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: linkedContactId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Contacts unlinked

  /providers:
    get:
      tags: [Providers]
      security: [{ bearerAuth: [] }]
      summary: List Provider Profiles
      responses:
        '200':
          description: Provider Profiles

  /providers/{id}:
    get:
      tags: [Providers]
      security: [{ bearerAuth: [] }]
      summary: Get Provider Profile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Provider Profile

  /providers/{id}/link:
    post:
