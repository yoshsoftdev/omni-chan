# Example: HTTPS reverse proxy for production.
#
# Ports (systemd defaults):
#   omni-chan-frontend  → 127.0.0.1:8095  (Next.js, public UI)
#   omni-chan-backend   → 127.0.0.1:8070  (REST API + WebSocket /ws)
#   omni-chan-webhook   → 127.0.0.1:8090  (Meta/Telegram webhooks only)

upstream omni_frontend {
    server 127.0.0.1:8095;
}

upstream omni_backend {
    server 127.0.0.1:8070;
}

upstream omni_webhook {
    server 127.0.0.1:8090;
}

server {
    listen 443 ssl http2;
    server_name app.example.com;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    # Next.js — browser uses same-origin /api/v1 and /ws
    location / {
        proxy_pass http://omni_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Meta webhook subdomain (optional — or route /api/v1/webhooks on main domain to webhook upstream)
server {
    listen 443 ssl http2;
    server_name webhook.example.com;

    location / {
        proxy_pass http://omni_webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        client_max_body_size 4m;
        proxy_request_buffering off;
    }
}
