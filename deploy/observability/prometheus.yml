global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: omni
    static_configs:
      - targets: ["backend-service:9101"]
        labels: { service: backend-api }
      - targets: ["backend-event-consumer:9106"]
        labels: { service: backend-event-consumer }
      - targets: ["backend-scheduler:9107"]
        labels: { service: backend-scheduler }
      - targets: ["webhook-service:9104"]
        labels: { service: webhook-service }
      - targets: ["storage-service:9105"]
        labels: { service: storage-service }
      - targets: ["broadcast-orchestrator:9103"]
        labels: { service: broadcast-orchestrator }
      - targets: ["broadcast-worker:9102"]
        labels: { service: broadcast-worker }
