# NATS JetStream cluster node (ADR 0009). Copy to /etc/nats/nats-server.conf on each of the
# three hosts and set NODE_NAME / the route hosts. Keep exactly 3 nodes (odd count for quorum).
server_name: "NODE_NAME"          # nats-1 | nats-2 | nats-3, unique per host
listen: 0.0.0.0:4222              # clients (webhook, backend roles); firewall to app hosts only
http: 127.0.0.1:8222              # /healthz, /jsz, /varz for Prometheus; never public

jetstream {
  store_dir: /var/lib/nats
  max_file_store: 20G             # disk budget per node; stream MaxAge (7 days) bounds usage first
}

cluster {
  name: omni
  listen: 0.0.0.0:6222            # routes between the 3 nodes only
  routes: [
    nats-route://nats-1.internal:6222
    nats-route://nats-2.internal:6222
    nats-route://nats-3.internal:6222
  ]
}
